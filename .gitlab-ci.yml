    - sed -i "s|__IMAGE_TAG__|qa-${CI_COMMIT_SHORT_SHA}|g" ./backend/k8s/qa/deployment.yaml
    - kubectl apply -f ./backend/k8s/qa/deployment.yaml
    - kubectl apply -f ./backend/k8s/qa/service.yaml
    - kubectl apply -f ./backend/k8s/qa/ingress.yaml
    - kubectl rollout restart deployment/nfc-ingestion-backend-qa --namespace=nfc-staging
    - kubectl rollout status deployment/nfc-ingestion-backend-qa --namespace=nfc-staging --timeout=300s
