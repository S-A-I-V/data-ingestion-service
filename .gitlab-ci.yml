# ==========================================
# FRONTEND PIPELINE TRIGGER (MAF)
# ==========================================
TRIGGER_FRONTEND_PIPELINE:
  stage: build
  trigger:
    include:
      - local: frontend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "qa" || $CI_COMMIT_BRANCH == "prod"'


