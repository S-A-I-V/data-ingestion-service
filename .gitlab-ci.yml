# Root GitLab CI/CD Pipeline for NFC Data Ingestion
# Backend (Python/FastAPI) deploys to KaaS via Docker + k8s
# Frontend deploys to MAF via maf-cli

include:
  - project: 'nielsen-media/cybersecurity/product-security/gold-config'
    ref: main
    file: 'sast/sast.nlsn.yml'

stages:
  - db-migrate
  - build
  - test
  - deploy
  - deploy-manifest

default:
  tags:
    - $GITLAB_RUNNER

variables:
  IMAGE_BASE: "registry.gitlab.com/nielsen-media/nielsen-fulfillment-center/nfc-admin"
  PROD_IMAGE_VERSION: v1.0.0
  # Kubernetes Contexts — KaaS2 agent contexts via NFC runner
  DEV_KUBE_CONTEXT: "nielsen-media/platforms/tools-devops-external/runners-as-a-service/runner-nfc-backend:kaas2-ue1-nonprod"
  QA_KUBE_CONTEXT: "nielsen-media/platforms/tools-devops-external/runners-as-a-service/runner-nfc-backend:kaas2-ue1-nonprod"
  PROD_KUBE_CONTEXT: "nielsen-media/platforms/tools-devops-external/runners-as-a-service/runner-nfc-backend:kaas2-ue1-prod"
  # Namespace for KaaS2
  K8S_NAMESPACE_DEV: "nfc-admin-backend"
  K8S_NAMESPACE_QA: "nfc-admin-backend"
  K8S_NAMESPACE_PROD: "nfc-admin-backend"
  SAST_EXCLUDED_PATHS: "node_modules, dist, build, frontend/node_modules, backend/.pytest_cache"

# ==========================================
# DATABASE MIGRATIONS (Liquibase)
# ==========================================
# Runs Liquibase update against nfc_admin schema.
# Uses the same DB_USER/DB_PASSWORD as the application (injected via CI variables).
# Idempotent — only applies new changesets, safe to run on every deploy.

# TODO: Once the dedicated backend runner ($GITLAB_RUNNER) is provisioned,
# remove `when: manual` and `allow_failure: true` to restore automatic execution.
# Original trigger: automatic on push to dev/feature/maf-deployment with backend/db/** changes.
DB_MIGRATE_DEV:
  stage: db-migrate
  environment:
    name: dev
  image: liquibase/liquibase:4.29
  variables:
    DB_HOST: $NFC_ADMIN_DB_HOST
    DB_PORT: "5432"
    DB_NAME: $NFC_ADMIN_DB_NAME
    DB_USER: $NFC_ADMIN_DB_USER
    DB_PASSWORD: $NFC_ADMIN_DB_PASSWORD
  script:
    - cd backend
    - liquibase --defaults-file=db/liquibase.properties status
    - liquibase --defaults-file=db/liquibase.properties update
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - backend/db/**/*
  when: manual
  allow_failure: true

DB_MIGRATE_QA:
  stage: db-migrate
  environment:
    name: qa
  image: liquibase/liquibase:4.29
  variables:
    DB_HOST: $NFC_ADMIN_DB_HOST
    DB_PORT: "5432"
    DB_NAME: $NFC_ADMIN_DB_NAME
    DB_USER: $NFC_ADMIN_DB_USER
    DB_PASSWORD: $NFC_ADMIN_DB_PASSWORD
  script:
    - cd backend
    - liquibase --defaults-file=db/liquibase.properties status
    - liquibase --defaults-file=db/liquibase.properties update
  rules:
    - if: $CI_COMMIT_BRANCH == "qa"
      changes:
        - backend/db/**/*

DB_MIGRATE_PROD:
  stage: db-migrate
  environment:
    name: prod
  image: liquibase/liquibase:4.29
  variables:
    DB_HOST: $NFC_ADMIN_DB_HOST_PROD
    DB_PORT: "5432"
    DB_NAME: $NFC_ADMIN_DB_NAME_PROD
    DB_USER: $NFC_ADMIN_DB_USER_PROD
    DB_PASSWORD: $NFC_ADMIN_DB_PASSWORD_PROD
  script:
    - cd backend
    - liquibase --defaults-file=db/liquibase.properties status
    - liquibase --defaults-file=db/liquibase.properties update
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      changes:
        - backend/db/**/*
  when: manual

# ==========================================
# BACKEND - DEV
# ==========================================
BUILD_BACKEND_DEV:
  stage: build
  environment:
    name: dev
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    - echo "Building Docker image for Dev"
    - mkdir -p /kaniko/.docker
    - echo "{\"credsStore\":\"ecr-login\"}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/backend/" \
        --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile" \
        --destination "${IMAGE_BASE}/backend:dev-${CI_COMMIT_SHORT_SHA}" \
        --build-arg APP_ENV=dev \
        --build-arg CI_JOB_TOKEN=${CI_JOB_TOKEN}
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

DEPLOY_BACKEND_DEV:
  stage: deploy
  environment:
    name: dev
  image: registry.gitlab.com/nielsen-media/nfc/kubectl:v1.0.0
  needs:
    - BUILD_BACKEND_DEV
  variables:
    KUBE_CONTEXT: $DEV_KUBE_CONTEXT
  script:
    - kubectl config get-contexts
    - kubectl config use-context "$KUBE_CONTEXT"
    # Create/update image pull secret (uses CI_JOB_TOKEN for registry auth)
    - >
      kubectl create secret docker-registry gitlab-registry-secret
      --namespace=$K8S_NAMESPACE_DEV
      --docker-server="$CI_REGISTRY"
      --docker-username=gitlab-ci-token
      --docker-password="$CI_JOB_TOKEN"
      --docker-email="ci@gitlab.com"
      --dry-run=client -o yaml | kubectl apply -f -
    # Apply app secrets (substituted from GitLab CI masked variables)
    - sed -i "s|__DATABASE_URL__|$NFC_ADMIN_DATABASE_URL|g" ./backend/k8s/dev/secrets.yaml
    - sed -i "s|__SECRET_KEY__|$NFC_ADMIN_SECRET_KEY|g" ./backend/k8s/dev/secrets.yaml
    - kubectl apply -f ./backend/k8s/dev/secrets.yaml
    # Apply deployment with image tag
    - sed -i "s|__IMAGE_TAG__|dev-${CI_COMMIT_SHORT_SHA}|g" ./backend/k8s/dev/deployment.yaml
    - kubectl apply -f ./backend/k8s/dev/deployment.yaml
    - kubectl apply -f ./backend/k8s/dev/service.yaml
    - kubectl apply -f ./backend/k8s/dev/ingress.yaml
    - kubectl rollout restart deployment/nfc-admin-backend --namespace=$K8S_NAMESPACE_DEV
    - kubectl rollout status deployment/nfc-admin-backend --namespace=$K8S_NAMESPACE_DEV --timeout=300s
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

