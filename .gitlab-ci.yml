# ==========================================
# BACKEND - PROD
# ==========================================
BUILD_BACKEND_PROD:
  stage: build
  environment:
    name: prod
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    - echo "Building Docker image for Prod"
    - mkdir -p /kaniko/.docker
    - echo "{\"credsStore\":\"ecr-login\"}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/backend/" \
        --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile" \
        --destination "${IMAGE_BASE}/prod/backend:${PROD_IMAGE_VERSION}" \
        --build-arg APP_ENV=prod \
        --build-arg CI_JOB_TOKEN=${CI_JOB_TOKEN}
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"

DEPLOY_BACKEND_PROD:
  stage: deploy
  environment:
    name: prod
  image: registry.gitlab.com/nielsen-media/nfc/kubectl:v1.0.0
  needs:
    - BUILD_BACKEND_PROD
  variables:
    KUBE_CONTEXT: $PROD_KUBE_CONTEXT
  script:
    - kubectl config get-contexts
    - kubectl config use-context "$KUBE_CONTEXT"
    - sed -i "s|__IMAGE_TAG__|${PROD_IMAGE_VERSION}|g" ./backend/k8s/prod/deployment.yaml
    - kubectl apply -f ./backend/k8s/prod/deployment.yaml
    - kubectl apply -f ./backend/k8s/prod/service.yaml
    - kubectl apply -f ./backend/k8s/prod/ingress.yaml
    - kubectl rollout restart deployment/nfc-ingestion-backend --namespace=nfc-backend
    - kubectl rollout status deployment/nfc-ingestion-backend --namespace=nfc-backend --timeout=300s
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
  when: manual

# ==========================================
# FRONTEND PIPELINE TRIGGER (MAF)
# ==========================================
TRIGGER_FRONTEND_PIPELINE:
  stage: build
  trigger:
    include:
      - local: frontend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "qa" || $CI_COMMIT_BRANCH == "prod" || $CI_COMMIT_BRANCH == "feature/maf-deployment"'

# ==========================================
# SECRET CREATION (Manual)
# ==========================================
SECRET_CREATION_DEV:
  stage: deploy
  environment:
    name: dev
  image: registry.gitlab.com/nielsen-media/nfc/kubectl:v1.0.0
  needs: []
  variables:
    KUBE_CONTEXT: $DEV_KUBE_CONTEXT
  script:
    - kubectl config use-context "$KUBE_CONTEXT"
    - kubectl delete secret gitlab-registry-secret --namespace=nfc-backend --ignore-not-found
    - >
      kubectl create secret docker-registry gitlab-registry-secret
      --namespace=nfc-backend
      --docker-server="$CI_REGISTRY"
      --docker-username="$REGISTRY_USER"
      --docker-password="$REGISTRY_PASSWORD"
      --docker-email="$REGISTRY_EMAIL"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  when: manual
