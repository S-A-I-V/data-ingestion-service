apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfc-ingestion-backend-qa
  namespace: nfc-staging
  labels:
    app: nfc-ingestion-backend
    environment: qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nfc-ingestion-backend-qa
  template:
    metadata:
      labels:
        app: nfc-ingestion-backend-qa
        environment: qa
    spec:
      serviceAccountName: nfc-backend-sa
      imagePullSecrets:
        - name: gitlab-registry-secret-qa
      containers:
        - name: nfc-ingestion-backend
          image: registry.gitlab.com/nielsen-media/nfc/qa/backend:__IMAGE_TAG__
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "staging"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nfc-backend-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nfc-backend-secrets
                  key: secret-key
            - name: FRONTEND_URL
              value: "https://nfc-staging.dev.apps.nielsen.com"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
