apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfc-ingestion-backend
  namespace: nfc-backend
  labels:
    app: nfc-ingestion-backend
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nfc-ingestion-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nfc-ingestion-backend
        environment: prod
    spec:
      serviceAccountName: nfc-backend-sa
      imagePullSecrets:
        - name: gitlab-registry-secret-prod
      containers:
        - name: nfc-ingestion-backend
          image: registry.gitlab.com/nielsen-media/nfc/prod/backend:__IMAGE_TAG__
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nfc-backend-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nfc-backend-secrets
                  key: secret-key
            - name: FRONTEND_URL
              value: "https://nfc.apps.nielsen.com"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
