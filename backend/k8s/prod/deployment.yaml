apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfc-admin-backend
  namespace: nfc-admin-backend
  labels:
    app: nfc-admin-backend
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nfc-admin-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nfc-admin-backend
        environment: prod
    spec:
      serviceAccountName: nfc-backend-sa
      imagePullSecrets:
        - name: gitlab-registry-secret
      # KaaS2 provisioner: AMD node pool (mayank-mohit)
      # NOTE: Prod tolerations may differ once prod namespace is provisioned.
      # Update these values with what the platform team provides for prod.
      nodeSelector:
        provisioner: mayank-mohit-amd-node-pool
      tolerations:
        - key: "workload-leader-amd64"
          operator: "Equal"
          value: "mayank-mohit"
          effect: "NoSchedule"
      containers:
        - name: nfc-admin-backend
          image: registry.gitlab.com/nielsen-media/nielsen-fulfillment-center/nfc-admin/prod/backend:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nfc-backend-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nfc-backend-secrets
                  key: secret-key
            - name: FRONTEND_URL
              value: "https://nfc.apps.nielsen.com"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
