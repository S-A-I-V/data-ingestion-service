# ═══════════════════════════════════════════════════════════════════════════════
# NFC Admin Portal — Docker Compose (frontend + backend only)
# ═══════════════════════════════════════════════════════════════════════════════
# The app connects to the remote nfc_prod RDS instance (nfc_admin schema).
# No local Postgres container is needed.
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f backend    # Tail backend logs
#   docker compose down               # Stop all services

version: "3.9"

services:
  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - LOG_FORMAT=structured
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production-32chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-change-in-prod-32ch}
      - FRONTEND_URL=http://localhost:5173
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped

  # ── Frontend (Vite/React) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
