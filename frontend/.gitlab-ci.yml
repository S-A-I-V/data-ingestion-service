# GitLab CI/CD Pipeline for NFC Data Ingestion Frontend (MAF Deployment)
# Supports multi-environment deployment via MAF CLI.

stages:
  - test
  - build
  - deploy
  - deploy-manifest

variables:
  NODE_VERSION: "22"
  ASSETS_VERSION: "1.0.0"
  APP_NAME: "NFC"
  EXTERNAL_GW_URL: "https://externalgw.api.dev.apps.nielsen.com"
  EXTERNAL_PROD_GW_URL: "https://externalgw.api.apps.nielsen.com"
  MAF_CLI_FLAGS: "--no-auto-update"

# ── Reusable Scripts ──────────────────────────────────────────────────────────

.npmrc_setup: &npmrc_setup
  - cd frontend

.build_zip_and_verify: &build_zip_and_verify
  - cd build
  - zip -r "$ZIP_NAME" "$FOLDER_NAME"/
  - cd ..
  - ls -la "build/$FOLDER_NAME/"
  - ls -la "build/$ZIP_NAME"

# =========================================================
# 1. DEV ENVIRONMENT
# =========================================================
BUILD_FRONTEND_DEV:
  stage: build
  environment:
    name: dev
  image: node:${NODE_VERSION}-alpine
  before_script:
    - *npmrc_setup
    - apk add --no-cache zip
    - npm ci
  script:
    - npm run build:preprod
    - export ZIP_NAME="nfc-admin.zip"
    - export FOLDER_NAME="nfc-admin"
    - *build_zip_and_verify
  artifacts:
    name: "build-dev-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - frontend/build/nfc-admin/
      - frontend/build/nfc-admin.zip
      - frontend/conf/dev-env/apps/nfc-admin/
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "feature/maf-deployment"

DEPLOY_FRONTEND_DEV:
  stage: deploy
  environment:
    name: dev
    url: https://nfc.dev.apps.nielsen.com/nfc-admin
  image: node:${NODE_VERSION}-alpine
  needs: ["BUILD_FRONTEND_DEV"]
  before_script:
    - cd frontend
    - npm config set @nielsen-media:registry https://gitlab.com/api/v4/projects/23296024/packages/npm/
    - npm config set //gitlab.com/api/v4/projects/23296024/packages/npm/:_authToken ${MAF_REGISTRY_TOKEN}
    - npm install -g @nielsen-media/maf-cli
  script:
    - 'echo "Starting ASSET deployment for NFC Admin DEV"'
    - "command -v maf-cli >/dev/null || exit 1"
    - '[ -f "build/nfc-admin.zip" ] || exit 1'
    - >
      maf-cli deploy "$MAF_CLI_FLAGS"
      --external-gw-url "$EXTERNAL_GW_URL"
      --app-token "$MAF_APP_TOKEN"
      --api-token "$MAF_API_TOKEN"
      --type assets
      --assets-zip-path "build/nfc-admin.zip"
      --assets-app-version "$ASSETS_VERSION"
    - 'echo "Assets deployed successfully"'
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "feature/maf-deployment"

DEPLOY_MANIFEST_DEV:
  stage: deploy-manifest
  environment:
    name: dev
  image: node:${NODE_VERSION}-alpine
  needs: ["BUILD_FRONTEND_DEV"]
  before_script:
    - cd frontend
    - npm config set @nielsen-media:registry https://gitlab.com/api/v4/projects/23296024/packages/npm/
    - npm config set //gitlab.com/api/v4/projects/23296024/packages/npm/:_authToken ${MAF_REGISTRY_TOKEN}
    - npm install -g @nielsen-media/maf-cli
  script:
    - 'echo "Starting MANIFEST deployment for NFC Admin DEV"'
    - "command -v maf-cli >/dev/null || exit 1"
    - '[ -f "conf/dev-env/apps/nfc-admin/nfc-admin.json" ] || exit 1'
    - >
      maf-cli deploy "$MAF_CLI_FLAGS"
      --external-gw-url "$EXTERNAL_GW_URL"
      --app-token "$MAF_APP_TOKEN"
      --api-token "$MAF_API_TOKEN"
      --type manifest
      --manifest-path "conf/dev-env/apps/nfc-admin/nfc-admin.json"
    - 'echo "Manifest deployed successfully"'
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "feature/maf-deployment"

# =========================================================
# 2. QA / STAGING ENVIRONMENT
# =========================================================
BUILD_FRONTEND_QA:
  stage: build
  environment:
    name: qa
  image: node:${NODE_VERSION}-alpine
  before_script:
    - *npmrc_setup
    - apk add --no-cache zip
    - yarn install --frozen-lockfile
  script:
    - yarn typecheck
    - yarn build:qa
    - export ZIP_NAME="nfc-staging.zip"
    - export FOLDER_NAME="nfc-staging"
    - *build_zip_and_verify
  artifacts:
    name: "build-qa-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - frontend/build/nfc-staging/
      - frontend/build/nfc-staging.zip
      - frontend/conf/dev-env/apps/nfc-staging/
  rules:
    - if: $CI_COMMIT_BRANCH == "qa"

DEPLOY_FRONTEND_QA:
  stage: deploy
  environment:
    name: qa
    url: https://nfc-staging.dev.apps.nielsen.com/nfc-staging
  image: node:${NODE_VERSION}-alpine
  needs: ["BUILD_FRONTEND_QA"]
  before_script:
    - cd frontend
    - npm config set @nielsen-media:registry https://gitlab.com/api/v4/projects/23296024/packages/npm/
    - npm config set //gitlab.com/api/v4/projects/23296024/packages/npm/:_authToken ${MAF_REGISTRY_TOKEN}
    - npm install -g @nielsen-media/maf-cli
  script:
    - 'echo "Starting ASSET deployment for NFC QA"'
    - "command -v maf-cli >/dev/null || exit 1"
    - '[ -f "build/nfc-staging.zip" ] || exit 1'
    - >
      maf-cli deploy "$MAF_CLI_FLAGS"
      --external-gw-url "$EXTERNAL_GW_URL"
      --app-token "$MAF_APP_TOKEN"
      --api-token "$MAF_API_TOKEN"
      --type assets
      --assets-zip-path "build/nfc-staging.zip"
      --assets-app-version "$ASSETS_VERSION"
    - 'echo "Assets deployed successfully"'
  rules:
    - if: $CI_COMMIT_BRANCH == "qa"
  when: manual

DEPLOY_MANIFEST_QA:
  stage: deploy-manifest
  environment:
    name: qa
  image: node:${NODE_VERSION}-alpine
  needs: ["BUILD_FRONTEND_QA"]
  before_script:
    - cd frontend
    - npm config set @nielsen-media:registry https://gitlab.com/api/v4/projects/23296024/packages/npm/
    - npm config set //gitlab.com/api/v4/projects/23296024/packages/npm/:_authToken ${MAF_REGISTRY_TOKEN}
    - npm install -g @nielsen-media/maf-cli
  script:
    - 'echo "Starting MANIFEST deployment for NFC QA"'
    - "command -v maf-cli >/dev/null || exit 1"
    - '[ -f "conf/dev-env/apps/nfc-staging/nfc-staging.json" ] || exit 1'
    - >
      maf-cli deploy "$MAF_CLI_FLAGS"
      --external-gw-url "$EXTERNAL_GW_URL"
      --app-token "$MAF_APP_TOKEN"
      --api-token "$MAF_API_TOKEN"
      --type manifest
      --manifest-path "conf/dev-env/apps/nfc-staging/nfc-staging.json"
    - 'echo "Manifest deployed successfully"'
  rules:
    - if: $CI_COMMIT_BRANCH == "qa"
  when: manual

# =========================================================
# 3. PROD ENVIRONMENT
# =========================================================
BUILD_FRONTEND_PROD:
  stage: build
  environment:
    name: prod
  image: node:${NODE_VERSION}-alpine
  before_script:
    - *npmrc_setup
    - apk add --no-cache zip
    - yarn install --frozen-lockfile
  script:
    - yarn typecheck
    - yarn build:prod
    - export ZIP_NAME="nfc.zip"
    - export FOLDER_NAME="nfc"
    - *build_zip_and_verify
  artifacts:
    name: "build-prod-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - frontend/build/nfc/
      - frontend/build/nfc.zip
      - frontend/conf/dev-env/apps/nfc/
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"

DEPLOY_FRONTEND_PROD:
  stage: deploy
  environment:
    name: prod
    url: https://nfc.apps.nielsen.com/nfc/
  image: node:${NODE_VERSION}-alpine
  needs: ["BUILD_FRONTEND_PROD"]
  before_script:
    - cd frontend
    - npm config set @nielsen-media:registry https://gitlab.com/api/v4/projects/23296024/packages/npm/
    - npm config set //gitlab.com/api/v4/projects/23296024/packages/npm/:_authToken ${MAF_REGISTRY_TOKEN}
    - npm install -g @nielsen-media/maf-cli
  script:
    - 'echo "Starting ASSET deployment for NFC PROD"'
    - "command -v maf-cli >/dev/null || exit 1"
    - '[ -f "build/nfc.zip" ] || exit 1'
    - >
      maf-cli deploy "$MAF_CLI_FLAGS"
      --external-gw-url "$EXTERNAL_PROD_GW_URL"
      --app-token "$MAF_APP_TOKEN"
      --api-token "$MAF_API_TOKEN"
      --type assets
      --assets-zip-path "build/nfc.zip"
      --assets-app-version "$ASSETS_VERSION"
    - 'echo "Assets deployed successfully"'
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
  when: manual

DEPLOY_MANIFEST_PROD:
  stage: deploy-manifest
  environment:
    name: prod
  image: node:${NODE_VERSION}-alpine
  needs: ["BUILD_FRONTEND_PROD"]
  before_script:
    - cd frontend
    - npm config set @nielsen-media:registry https://gitlab.com/api/v4/projects/23296024/packages/npm/
    - npm config set //gitlab.com/api/v4/projects/23296024/packages/npm/:_authToken ${MAF_REGISTRY_TOKEN}
    - npm install -g @nielsen-media/maf-cli
  script:
    - 'echo "Starting MANIFEST deployment for NFC PROD"'
    - "command -v maf-cli >/dev/null || exit 1"
    - '[ -f "conf/dev-env/apps/nfc/nfc.json" ] || exit 1'
    - >
      maf-cli deploy "$MAF_CLI_FLAGS"
      --external-gw-url "$EXTERNAL_PROD_GW_URL"
      --app-token "$MAF_APP_TOKEN"
      --api-token "$MAF_API_TOKEN"
      --type manifest
      --manifest-path "conf/dev-env/apps/nfc/nfc.json"
    - 'echo "Manifest deployed successfully"'
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
  when: manual
